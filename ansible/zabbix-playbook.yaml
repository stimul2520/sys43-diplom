---

- name: install zabbix
  hosts: zabbix
  become: true

  tasks:
  - name: apt update
    apt:
      update_cache: yes

  - name: install  postgresql
    apt:
      name: postgresql
      state: latest

  - name: download zabbix
    get_url:
      url: https://repo.zabbix.com/zabbix/7.4/release/ubuntu/pool/main/z/zabbix-release/zabbix-release_latest_7.4+ubuntu24.04_all.deb
      dest: /tmp/zabbix-release_latest_7.4+ubuntu24.04_all.deb
      mode: 0644

  - name: dpkg -i zabbix
    apt:
      deb: /tmp/zabbix-release_latest_7.4+ubuntu24.04_all.deb

  - name: apt update
    apt:
      update_cache: yes

  - name: install zabbix-server-pgsql zabbix-frontend-php php8.3-pgsql zabbix-apache-conf zabbix-sql-scripts zabbix-agent
    apt:
      name:
      - zabbix-frontend-php
      - php8.3-pgsql
      - zabbix-apache-conf
      - zabbix-sql-scripts
      - zabbix-agent
      state: latest

  - name: create user and initial database zabbix, import initial schema and data, configure DBPassword
    shell: |
      sudo -u postgres psql -c "CREATE USER zabbix WITH PASSWORD '7949';"
      sudo -u postgres psql -c "CREATE DATABASE zabbix OWNER zabbix;"
      zcat /usr/share/zabbix-sql-scripts/postgresql/server.sql.gz | sudo -u zabbix psql zabbix
      sudo sed -i 's/# DBPassword=/DBPassword=7949/g' /etc/zabbix/zabbix_server.conf

  - name: start Zabbix server and agent processes
    shell: |
      systemctl restart zabbix-server apache2
      systemctl enable zabbix-server apache2
